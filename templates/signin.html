{{template "layout.html" .}}

{{define "title"}}Sign In{{end}}

{{define "content"}}
<form method="post" style="margin-top:1em;">
    {{ .Global.CSRFField }}
    <div class="meta-card" style="margin:0 0 1.25rem;">
        <div class="meta-section-heading">
            <h4>Dashboard Sign In</h4>
        </div>

        <div class="field" style="margin-bottom:1em;">
            <label for="username" class="form-label-sm">Username:</label>
            <input type="text" id="username" name="username" required class="input-cozy-sm">
        </div>

        <div class="field" style="margin-bottom:1em;">
            <label for="password" class="form-label-sm">Password:</label>
            <input type="password" id="password" name="password" required class="input-cozy-sm">
        </div>

        <button type="submit" class="btn-cozy">Sign In</button>
    </div>
</form>

<div class="meta-card" style="margin:0 0 1.25rem;">
    <div style="display:flex; flex-direction:column; gap:.6rem;">
        <button id="passkeySignInBtn" type="button" class="btn-cozy-secondary">🔑 Sign in with a passkey</button>
        <div id="passkeyMsg" class="form-hint" style="font-size:.6rem; min-height:1em;"></div>
    </div>
</div>

<br />
<div>
    <small>Don't have an account? Sign up <a href="/signup">here</a>.</small>
</div>
<div>
    <small>Note that by using <i>{{.Global.SiteName}}</i> you agree to our <a href="/terms-and-conditions">Terms and
            Conditions</a>.</small>
</div>


{{end}}

{{define "scripts"}}
<script src="/assets/js/passkeys.js"></script>
<script>
  (function () {
    const btn = document.getElementById('passkeySignInBtn');
    const msg = document.getElementById('passkeyMsg');
    if (!btn) return;
    if (!window.PublicKeyCredential) {
      btn.style.display = 'none';
      return;
    }
    btn.addEventListener('click', async () => {
      msg.style.color = '';
      msg.textContent = 'Follow your browser prompts…';
      btn.disabled = true;
      try {
        const result = await window.Passkeys.login();
        window.location.href = (result && result.redirect) || '/dashboard';
      } catch (err) {
        msg.style.color = '#b00020';
        msg.textContent = 'Passkey sign-in failed: ' + (err.message || err);
        btn.disabled = false;
      }
    });
  })();
</script>
{{end}}
