# https://taskfile.dev

version: "3"

tasks:
  default:
    - task --list-all

  lint:
    - go run github.com/nishanths/exhaustive/cmd/exhaustive@latest -default-signifies-exhaustive ./...
    - go run honnef.co/go/tools/cmd/staticcheck@latest ./...
    - go vet ./...

  release:
    deps: [tidy, lint, test, fmt]
    cmds:
      - go build -tags="release"

  tidy:
    - go mod tidy -v

  update-deps:
    cmds:
      - go get -u
      - go clean -modcache
      - task tidy

  test:
    - go test -v ./...

  run:
    - go run .

  dev:
    - air -c .air.toml

  fmt:
    - go fmt ./...

  tailwind-watch:
    cmds:
      - ./tailwindcss -i assets/css/tailwind.css -o assets/css/main.css --watch
    desc: "Run Tailwind CSS in watch mode to automatically compile changes."

  tailwind-build:
    cmds:
      - ./tailwindcss -i assets/css/tailwind.css -o assets/css/main.css --minify
    desc: "Build and minify Tailwind CSS for production."


  download_tailwind:
    cmds:
      - curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
      - chmod +x tailwindcss-linux-x64
      - mv tailwindcss-linux-x64 tailwindcss
    desc: "Download and set up the Tailwind CSS CLI."
